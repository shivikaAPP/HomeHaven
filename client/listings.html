<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listings | HomeHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="navbar">
        <div class="container nav-wrap">
          <a href="index.html" class="brand">HomeHaven</a>
          <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="listings.html">Listings</a>
            <a href="categories.html">Categories</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin.html">Admin</a>
          </nav>
          <div class="nav-actions">
            <button class="btn btn-outline btn-small ripple" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
            <button class="btn btn-primary btn-small ripple" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          </div>
        </div>
        <div class="container mobile-nav hidden" id="mobileNav">
          <a href="index.html">Home</a>
          <a href="listings.html">Listings</a>
          <a href="categories.html">Categories</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="admin.html">Admin</a>
        </div>
      </header>

      <main class="container section">
        <section class="dashboard-card reveal" style="margin-bottom:1.2rem;">
          <h2>Search properties</h2>
          <form id="filterForm" class="form-grid">
            <div class="grid-2">
              <input id="searchInput" placeholder="Search by title, city, or location" />
              <input id="cityFilter" placeholder="City" />
            </div>
            <div class="grid-2">
              <select id="typeFilter">
                <option value="">All Types</option>
                <option value="House">House</option>
                <option value="Apartment">Apartment</option>
                <option value="Villa">Villa</option>
                <option value="Penthouse">Penthouse</option>
                <option value="Plot">Plot</option>
              </select>
              <input id="bedroomsFilter" type="number" placeholder="Bedrooms" />
            </div>
            <div class="grid-2">
              <input id="minPriceFilter" type="number" placeholder="Min Price" />
              <input id="maxPriceFilter" type="number" placeholder="Max Price" />
            </div>
            <button class="btn btn-primary" type="submit">Apply Filters</button>
          </form>
        </section>

        <section>
          <div id="propertyGrid" class="property-grid"></div>
        </section>
      </main>

      <div id="modal" class="modal hidden">
        <div class="modal-card">
          <button class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
          <div id="modalBody"></div>
        </div>
      </div>

      <div id="loadingScreen" class="loading-screen hidden"><div class="spinner"></div></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/animations.js"></script>
  </body>
</html>
