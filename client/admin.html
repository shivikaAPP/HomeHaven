<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | HomeHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="navbar">
        <div class="container nav-wrap">
          <a href="index.html" class="brand">HomeHaven</a>
          <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="listings.html">Listings</a>
            <a href="categories.html">Categories</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin.html">Admin</a>
          </nav>
          <div class="nav-actions">
            <button class="btn btn-outline btn-small ripple" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
            <button class="btn btn-primary btn-small ripple" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          </div>
        </div>
        <div class="container mobile-nav hidden" id="mobileNav">
          <a href="index.html">Home</a>
          <a href="listings.html">Listings</a>
          <a href="categories.html">Categories</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="admin.html">Admin</a>
        </div>
      </header>

      <main class="container section dashboard-shell">
        <section class="dashboard-card reveal">
          <h2>Admin panel</h2>
          <p class="text-muted">Secure access to manage users, properties, enquiries, and categories.</p>
          <div class="form-grid">
            <input id="adminEmail" placeholder="Admin Email" />
            <input id="adminPassword" type="password" placeholder="Admin Password" />
            <button class="btn btn-primary" id="adminLoginButton">Admin Login</button>
            <div id="adminMessage" class="text-muted"></div>
          </div>
        </section>
        <section class="dashboard-card reveal">
          <h3>Overview</h3>
          <div id="adminStats" class="stat-list"></div>
        </section>
      </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/animations.js"></script>
  </body>
</html>
